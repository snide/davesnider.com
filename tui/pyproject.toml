[project]
name = "bookmarks-tui"
version = "0.1.0"
description = "Terminal UI for managing bookmarks in the site's Turso database"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2,<9",
    "libsql>=0.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "textual-autocomplete>=4.0.6,<5",
    "lz4>=4.0",
]

[project.scripts]
bookmarks-tui = "bookmarks_tui.app:main"

[dependency-groups]
dev = ["textual-dev>=1.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookmarks_tui"]
